name: CI

on:
  push:
    branches: ["**"] # tags are covered by release.yml, which calls this workflow
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Every supported version (README: Python 3.10+).
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install WeasyPrint system libraries and fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core fonts-noto-color-emoji
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Unit and regression tests
        run: python -m pytest

  tines-smoke:
    name: Tines-style cve_lookup.py run (minimal deps)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Run cve_lookup.py with only requests and keyring installed
        # Mirrors a Tines Run Script action: deps in a --target dir on PYTHONPATH, cwd = repo root,
        # stdin closed. A cached sandbox may have site-packages from an older requirements.txt,
        # so cve_lookup.py must work without any report-format libraries.
        run: |
          python -m pip install --quiet --target "$RUNNER_TEMP/site-packages" requests keyring
          export PYTHONPATH="$RUNNER_TEMP/site-packages"
          python cve_lookup.py --version < /dev/null
          python cve_lookup.py < /dev/null > help.txt
          grep --quiet -- "--csv" help.txt
          python -c "import cve_lookup, sys; bad = {'jinja2','matplotlib','weasyprint','docx','openpyxl'} & set(sys.modules); sys.exit(sorted(bad) or 0)"

  lint:
    name: Lint (black, isort, ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install black==26.10.1 isort==9.0.2 ruff==0.17.1
      - run: black --check --diff .
      - run: isort --check-only --diff .
      - run: ruff check .

  bandit:
    name: Bandit (Python security lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install bandit==1.9.4
      - name: Bandit (fails on medium severity and above)
        run: bandit --configfile pyproject.toml --recursive . --severity-level medium

  gitleaks:
    name: Gitleaks (secrets scan, full history)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No GITLEAKS_LICENSE needed: the repo belongs to a personal account.

  pip-audit:
    name: pip-audit (dependency vulnerabilities)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit runtime and development requirements
        run: pip-audit --requirement requirements.txt --requirement requirements-dev.txt --progress-spinner off
