name: Release

# Push a version tag (git tag -a v1.2.3 -m "..." && git push origin v1.2.3) to publish a
# GitHub Release with source archives, SHA256SUMS and build provenance.
# "Run workflow" with a tag publishes a release for an existing tag (e.g. after a failed run).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v1.3.0)"
        required: true

permissions:
  contents: read

jobs:
  ci:
    # Tag pushes must pass the full CI suite on the tagged commit before publishing.
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    if: ${{ !cancelled() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release
      id-token: write # sign provenance
      attestations: write
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - name: Validate tag name
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a vX.Y.Z tag"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build source archives
        run: |
          name="vuln-reports-${TAG}"
          mkdir dist
          git archive --format=tar.gz --prefix="${name}/" --output="dist/${name}.tar.gz" "refs/tags/${TAG}"
          git archive --format=zip --prefix="${name}/" --output="dist/${name}.zip" "refs/tags/${TAG}"
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## SHA256 checksums"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "Verify before running: \`sha256sum --check --ignore-missing SHA256SUMS\`"
            echo "Provenance: \`gh attestation verify vuln-reports-${TAG}.zip --repo ${GITHUB_REPOSITORY}\`"
          } > notes.md
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file notes.md \
            --generate-notes
