# Tool configuration only. The suite is run from a source checkout
# (python3 cve_lookup.py ...), not installed as a package.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["regression: golden-master comparison against the v1.0.0 CLI outputs"]

[tool.black]
line-length = 120
target-version = ["py310"]
extend-exclude = "tests/regression/golden|tests/fixtures"

[tool.isort]
profile = "black"
line_length = 120
skip_glob = ["tests/regression/golden/*", "tests/fixtures/*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tests/regression/golden", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]  # security rules are left to Bandit
ignore = [
    "E501",  # black owns line length; long URLs/strings are fine
]


[tool.bandit]
exclude_dirs = ["tests", ".venv"]
